<!doctype html>
<html lang="pt-br" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meus Decks - Mercadia</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="style.css" />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
      .deck-card {
        cursor: pointer;
        overflow: hidden;
        border-radius: var(--radius-lg);
      }
      .deck-cover {
        height: 160px;
        width: 100%;
        background-size: cover;
        background-position: center 25%;
        border-bottom: 0.5px solid var(--border-color);
        transition: var(--spring);
      }
      .deck-card:hover .deck-cover {
        transform: scale(1.05);
      }
      .deck-info {
        padding: 16px;
        background: var(--bg-panel);
        position: relative;
        z-index: 2;
      }

      .back-button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--accent-primary);
        font-weight: 500;
        cursor: pointer;
        font-size: 1.1rem;
        transition: var(--spring);
      }
      .back-button:hover {
        opacity: 0.7;
        transform: translateX(-4px);
      }

      .deck-columns {
        column-count: 1;
        column-gap: 1.5rem;
      }
      @media (min-width: 768px) {
        .deck-columns {
          column-count: 2;
        }
      }
      @media (min-width: 1200px) {
        .deck-columns {
          column-count: 3;
        }
      }

      .deck-group {
        break-inside: avoid-column;
        margin-bottom: 1.5rem;
        background: transparent;
      }

      .deck-group-header {
        color: var(--text-main);
        font-weight: 700;
        font-size: 0.95rem;
        letter-spacing: -0.01em;
        margin-bottom: 0.5rem;
        padding-bottom: 0.2rem;
        border-bottom: 0.5px solid var(--border-color);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .deck-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 6px;
        border-radius: 6px;
        cursor: pointer;
        transition: var(--spring);
        font-size: 0.9rem;
        color: var(--text-main);
      }

      .deck-item:hover {
        background: var(--bg-input);
      }
      .deck-item.missing {
        color: var(--accent-danger);
      }
      .deck-item.partial {
        color: var(--accent-warning);
      }

      .preview-sidebar {
        position: sticky;
        top: 80px;
      }

      .bottom-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background-color: var(--bg-glass);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border-top: 0.5px solid var(--border-color);
        padding: 12px 24px;
        z-index: 1000;
        display: flex;
        justify-content: space-around;
        align-items: center;
      }

      /* Hover nas imagens do Print Selector */
      .print-option {
        cursor: pointer;
        transition: transform 0.2s ease;
        border-radius: 12px;
      }
      .print-option:hover {
        transform: scale(1.05);
        box-shadow: 0 0 15px rgba(20, 184, 166, 0.5);
      }
    </style>
  </head>
  <body>
    <nav class="navbar sticky-top">
      <div class="container px-3">
        <div class="d-flex align-items-center w-100 justify-content-between">
          <span class="navbar-brand"
            >MERCADIA
            <span class="text-muted fw-normal" style="font-size: 1rem">| Decks</span></span
          >
          <div class="ms-auto d-flex gap-3 align-items-center">
            <a
              href="index.html"
              class="btn-filter text-decoration-none d-flex align-items-center gap-2"
              ><i class="bi bi-bar-chart-fill"></i> Dashboard</a
            >
            <button
              class="btn-filter d-flex align-items-center gap-2"
              style="
                background: var(--accent-primary);
                color: #fff;
                border: none;
                box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
              "
              onclick="openNewDeckModal()"
            >
              <i class="bi bi-plus-lg"></i> Novo Deck
            </button>
          </div>
        </div>
      </div>
    </nav>

    <div class="container mt-4 px-3 fade-in" style="padding-bottom: 80px">
      <div id="libraryView">
        <div class="d-flex justify-content-between align-items-end mb-4">
          <h2 class="fw-bold mb-0" style="letter-spacing: -0.03em">Sua Biblioteca</h2>
        </div>
        <div class="row g-4" id="decksGrid"></div>
      </div>

      <div id="deckDetailView" class="d-none">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="back-button" onclick="showLibrary()">
            <i class="bi bi-chevron-left"></i> Meus Decks
          </div>
          <button
            class="btn-action-icon text-danger"
            style="
              background: rgba(255, 59, 48, 0.1);
              border: 1px solid rgba(255, 59, 48, 0.3);
              width: 36px;
              height: 36px;
            "
            onclick="confirmDeleteDeck()"
            title="Apagar Deck"
          >
            <i class="bi bi-trash3-fill"></i>
          </button>
        </div>

        <div class="row g-4">
          <div class="col-12 col-lg-3">
            <div class="preview-sidebar">
              <img
                id="livePreviewImage"
                src="https://cards.scryfall.io/large/back/1/a/1a3a2e7c-8a1a-4632-bd88-0dfdb6495ff2.jpg"
                alt="Preview"
                class="img-fluid rounded-4 shadow-lg w-100 mb-3"
                style="min-height: 350px; background: var(--bg-input)"
                onclick="openCardModal(this.src)"
              />

              <div class="d-flex flex-wrap gap-2">
                <button
                  id="btnSetCover"
                  class="btn-filter flex-grow-1 d-flex justify-content-center align-items-center gap-1"
                  style="
                    background: var(--bg-input);
                    color: var(--text-main);
                    font-size: 0.8rem;
                    padding: 10px 0;
                  "
                  onclick="setAsCover()"
                >
                  <i class="bi bi-image"></i> Capa
                </button>
                <button
                  id="btnSetCommander"
                  class="btn-filter flex-grow-1 d-flex justify-content-center align-items-center gap-1"
                  style="
                    background: var(--bg-input);
                    color: var(--text-main);
                    font-size: 0.8rem;
                    padding: 10px 0;
                  "
                  onclick="setAsCommander()"
                >
                  <i class="bi bi-person-badge"></i> Comandante
                </button>
                <button
                  id="btnChangePrint"
                  class="btn-filter w-100 d-flex justify-content-center align-items-center gap-1"
                  style="
                    background: var(--bg-input);
                    color: var(--accent-primary);
                    font-size: 0.85rem;
                    padding: 10px 0;
                  "
                  onclick="openPrintSelector()"
                >
                  <i class="bi bi-palette"></i> Escolher Versão da Carta
                </button>
              </div>
            </div>
          </div>

          <div class="col-12 col-lg-9">
            <h1
              class="fw-bold mb-1"
              id="activeDeckName"
              style="font-size: 2.5rem; letter-spacing: -0.03em"
            >
              ...
            </h1>
            <span class="badge-tech mb-4 d-inline-block" id="activeDeckFormat"></span>
            <div class="deck-columns" id="deckMasonryContainer"></div>
          </div>
        </div>

        <div class="bottom-bar">
          <div class="text-center">
            <div
              class="text-muted"
              style="font-size: 0.65rem; text-transform: uppercase; font-weight: 700"
            >
              Cartas
            </div>
            <div class="fw-bold fs-6" id="kpiDeckOwnedCards">0 / 100</div>
          </div>
          <div class="text-center">
            <div
              class="text-muted"
              style="font-size: 0.65rem; text-transform: uppercase; font-weight: 700"
            >
              Valor do Deck
            </div>
            <div class="fw-bold fs-6" id="kpiDeckValue">R$ 0,00</div>
          </div>
          <div class="text-center">
            <div
              class="text-danger"
              style="font-size: 0.65rem; text-transform: uppercase; font-weight: 700"
            >
              Falta Comprar
            </div>
            <div class="fw-bold fs-6 text-danger" id="kpiDeckMissingValue">R$ 0,00</div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="newDeckModal" tabindex="-1" data-bs-backdrop="static">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0 pb-0 pt-4 px-4">
            <h5 class="modal-title fw-bold fs-4" style="letter-spacing: -0.02em">
              Importar Novo Deck
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <div class="row g-3 mb-3">
              <div class="col-12 col-md-8">
                <label class="text-muted small fw-bold text-uppercase mb-1">Nome do Deck</label
                ><input
                  type="text"
                  id="newDeckName"
                  class="form-control-dark w-100"
                  placeholder="Ex: Ur-Dragon Tribal"
                />
              </div>
              <div class="col-12 col-md-4">
                <label class="text-muted small fw-bold text-uppercase mb-1">Formato</label
                ><select id="newDeckFormat" class="form-control-dark w-100">
                  <option value="Commander">Commander</option>
                  <option value="Standard">Standard</option>
                  <option value="Pioneer">Pioneer</option>
                  <option value="Modern">Modern</option>
                  <option value="Pauper">Pauper</option>
                </select>
              </div>
            </div>
            <div class="mb-4">
              <label class="text-muted small fw-bold text-uppercase mb-1">Lista de Cartas</label
              ><textarea
                id="newDeckList"
                class="form-control-dark w-100"
                style="height: 250px; resize: none; font-family: monospace; font-size: 0.85rem"
                placeholder="1 O Ur-Dragão [C17]&#10;1 Anel Solar&#10;3 Montanha"
              ></textarea>
            </div>
            <div id="newDeckLoading" class="d-none text-center py-3">
              <div class="spinner-border text-primary mb-2" role="status"></div>
              <div class="text-muted small">O Scryfall está extraindo os metadados... Aguarde.</div>
            </div>
            <button
              id="btnSaveDeck"
              class="btn-filter w-100 py-3 mt-2"
              style="
                background: var(--accent-primary);
                color: #fff;
                font-size: 1.1rem;
                border-radius: var(--radius-md);
              "
              onclick="submitNewDeck()"
            >
              Salvar no Cofre
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="printSelectorModal" tabindex="-1">
      <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content" style="min-height: 70vh">
          <div class="modal-header border-bottom border-color py-3">
            <div class="d-flex flex-column">
              <span class="text-muted text-uppercase fw-bold" style="font-size: 0.7rem"
                >Escolher Versão</span
              >
              <h5 class="modal-title fw-bold mb-0" id="printSelectorTitle">...</h5>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4" style="background-color: var(--bg-body)">
            <div id="printSelectorLoading" class="text-center py-5 d-none">
              <div class="spinner-border text-primary mb-2"></div>
              <div class="text-muted">Buscando o acervo no Scryfall...</div>
            </div>
            <div class="row g-4" id="printSelectorGrid"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="imagePreviewModal" tabindex="-1">
      <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content border-0 bg-transparent shadow-none">
          <div class="modal-header border-0 pb-0 justify-content-end">
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body text-center p-0">
            <img
              id="scryfallImage"
              src=""
              alt="Card Preview"
              class="img-fluid rounded-4 shadow-lg"
              style="max-height: 70vh"
            />
          </div>
        </div>
      </div>
    </div>
    <script src="utils.js"></script>
    <script src="decks.js"></script>
  </body>
</html>
