<!doctype html>
<html lang="pt-br" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Mercadia</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .login-panel {
        background: var(--bg-glass);
        backdrop-filter: blur(40px) saturate(200%);
        -webkit-backdrop-filter: blur(40px) saturate(200%);
        border: 0.5px solid var(--border-color);
        border-radius: 24px;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
        text-align: center;
        animation: slideUp 0.6s var(--spring) forwards;
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(40px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .form-control-dark {
        font-size: 1.2rem;
        text-align: center;
        letter-spacing: 0.2em;
        padding: 15px;
        border-radius: 12px;
      }
      .form-control-dark::placeholder {
        letter-spacing: normal;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="login-panel">
      <h2 class="fw-bold mb-1" style="letter-spacing: -0.05em">MERCADIA</h2>
      <p class="text-muted small mb-4 text-uppercase fw-bold">Gerenciador de Coleções</p>

      <div
        id="errorMsg"
        class="alert alert-danger d-none small p-2 mb-3"
        style="
          background: rgba(255, 59, 48, 0.1);
          border-color: rgba(255, 59, 48, 0.3);
          color: var(--accent-danger);
        "
      ></div>

      <form id="loginForm" onsubmit="doLogin(event)">
        <input
          type="password"
          id="passInput"
          class="form-control form-control-dark mb-4"
          placeholder="Senha"
          required
          autofocus
          autocomplete="current-password"
        />
        <button
          type="submit"
          id="btnSubmit"
          class="btn-filter w-100"
          style="
            background: var(--accent-primary);
            color: #fff;
            font-size: 1.1rem;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 122, 255, 0.3);
          "
        >
          Acessar
        </button>
      </form>
    </div>

    <script>
      // Se já tiver token, pula o login e vai pro dashboard
      if (localStorage.getItem('mercadia_token')) window.location.href = 'index.html'

      async function doLogin(e) {
        e.preventDefault()
        const pass = document.getElementById('passInput').value
        const btn = document.getElementById('btnSubmit')
        const err = document.getElementById('errorMsg')

        err.classList.add('d-none')
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>'
        btn.disabled = true

        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pass }),
          })

          const data = await res.json()

          if (res.ok) {
            localStorage.setItem('mercadia_token', data.token)
            window.location.href = 'index.html'
          } else {
            err.innerText = data.error || 'Erro ao logar.'
            err.classList.remove('d-none')
            btn.innerHTML = 'Desbloquear Cofre'
            btn.disabled = false
            document.getElementById('passInput').value = ''
          }
        } catch (error) {
          err.innerText = 'Servidor fora do ar.'
          err.classList.remove('d-none')
          btn.innerHTML = 'Desbloquear Cofre'
          btn.disabled = false
        }
      }
    </script>
  </body>
</html>
